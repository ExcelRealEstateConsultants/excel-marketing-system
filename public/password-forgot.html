<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password | RapportLink</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;

        background:
          radial-gradient(
            circle at 18% 15%,
            rgba(255, 255, 255, 0.08) 0%,
            transparent 32%
          ),
          radial-gradient(
            circle at 88% 72%,
            rgba(0, 207, 112, 0.2) 0%,
            transparent 36%
          ),
          linear-gradient(
            115deg,
            #011c31 0%,
            #032c49 28%,
            #07515a 52%,
            #078a58 76%,
            #00a143 100%
          );
      }

      .rl-card {
        width: 100%;
        max-width: 430px;

        background: #ffffff;

        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 22px;

        padding: 34px 38px 36px;

        box-shadow:
          0 34px 75px rgba(1, 28, 49, 0.3),
          0 10px 26px rgba(1, 28, 49, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);

        text-align: center;
      }

      .rl-logo {
        display: block;

        width: 440px;
        max-width: none;
        height: auto;

        margin: -92px auto -82px;

        position: relative;
        left: 50%;
        transform: translateX(-50%);

        background: transparent;
        border: none;
        box-shadow: none;
      }

      h1 {
        margin: 0 0 9px;

        color: #042c49;

        font-size: 27px;
        line-height: 1.2;
        font-weight: 750;
        letter-spacing: -0.5px;
      }

      .rl-subtitle {
        margin: 0 0 27px;

        color: #6b7280;

        font-size: 14px;
        line-height: 1.55;
      }

      .rl-field {
        margin-bottom: 18px;
        text-align: left;
      }

      .rl-field label {
        display: block;

        margin-bottom: 7px;

        color: #334155;

        font-size: 13px;
        font-weight: 650;
      }

      .rl-field input {
        width: 100%;
        height: 46px;

        padding: 0 14px;

        border: 1px solid #d8dee7;
        border-radius: 10px;

        background: #ffffff;
        color: #0f172a;

        font-size: 15px;

        outline: none;

        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .rl-field input:focus {
        border-color: #00a143;
        box-shadow: 0 0 0 3px rgba(0, 161, 67, 0.1);
      }

      .rl-message {
        margin: 2px 0 16px;
        padding: 11px 12px;

        border-radius: 9px;

        font-size: 13px;
        line-height: 1.5;
        text-align: left;
      }

      .rl-error {
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: #b91c1c;
      }

      .rl-success {
        border: 1px solid #bbf7d0;
        background: #f0fdf4;
        color: #166534;
      }

      #rlResetRequestButton {
        width: 100%;
        height: 47px;

        border: 0;
        border-radius: 10px;

        background: #00a143;
        color: #ffffff;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        transition:
          transform 0.12s ease,
          background 0.12s ease,
          box-shadow 0.12s ease;
      }

      #rlResetRequestButton:hover {
        background: #008d3b;
        box-shadow: 0 7px 18px rgba(0, 161, 67, 0.2);
      }

      #rlResetRequestButton:active {
        transform: translateY(1px);
      }

      #rlResetRequestButton:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .rl-back {
        margin-top: 20px;
        font-size: 13px;
      }

      .rl-back a {
        color: #04783a;
        font-weight: 650;
        text-decoration: none;
      }

      .rl-back a:hover {
        text-decoration: underline;
      }

      @media (max-width: 520px) {
        body {
          padding: 20px 14px;
        }

        .rl-card {
          padding: 30px 24px 32px;
        }

        .rl-logo {
          width: 400px;
        }
      }
    </style>
  </head>

  <body>
    <main class="rl-card">
      <img src="rapportlink-login-logo.png" alt="RapportLink" class="rl-logo" />

      <h1>Forgot your password?</h1>

      <p class="rl-subtitle">
        Enter the email address associated with your RapportLink account. We'll
        send you a secure link to reset your password.
      </p>

      <form id="rlForgotPasswordForm">
        <div class="rl-field">
          <label for="rlForgotEmail">Email</label>

          <input
            type="email"
            id="rlForgotEmail"
            autocomplete="email"
            required
          />
        </div>

        <div
          id="rlForgotMessage"
          class="rl-message"
          style="display: none"
        ></div>

        <button type="submit" id="rlResetRequestButton">Send Reset Link</button>
      </form>

      <div class="rl-back">
        <a href="/">← Back to Sign In</a>
      </div>
    </main>

    <script>
      const forgotForm = document.getElementById("rlForgotPasswordForm");

      const emailInput = document.getElementById("rlForgotEmail");

      const resetButton = document.getElementById("rlResetRequestButton");

      const messageBox = document.getElementById("rlForgotMessage");

      function showMessage(message, type) {
        messageBox.textContent = message;

        messageBox.className =
          type === "success" ? "rl-message rl-success" : "rl-message rl-error";

        messageBox.style.display = "block";
      }

      forgotForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        messageBox.style.display = "none";
        messageBox.textContent = "";

        resetButton.disabled = true;
        resetButton.textContent = "Sending...";

        try {
          const email = emailInput.value.trim();

          const response = await fetch("/api/auth/forgot-password", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },

            body: JSON.stringify({
              email,
            }),
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to process your request.");
          }

          showMessage(
            data.message ||
              "If an active RapportLink account exists for that email, password reset instructions have been sent.",
            "success",
          );

          emailInput.value = "";
        } catch (error) {
          console.error("RapportLink forgot-password error:", error);

          showMessage(
            error.message ||
              "Unable to process your request. Please try again.",
            "error",
          );
        } finally {
          resetButton.disabled = false;
          resetButton.textContent = "Send Reset Link";
        }
      });
    </script>
  </body>
</html>
