<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password | RapportLink</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;

        background:
          radial-gradient(
            circle at 18% 15%,
            rgba(255, 255, 255, 0.08) 0%,
            transparent 32%
          ),
          radial-gradient(
            circle at 88% 72%,
            rgba(0, 207, 112, 0.2) 0%,
            transparent 36%
          ),
          linear-gradient(
            115deg,
            #011c31 0%,
            #032c49 28%,
            #07515a 52%,
            #078a58 76%,
            #00a143 100%
          );
      }

      .rl-card {
        width: 100%;
        max-width: 430px;

        background: #ffffff;

        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 22px;

        padding: 34px 38px 36px;

        box-shadow:
          0 34px 75px rgba(1, 28, 49, 0.3),
          0 10px 26px rgba(1, 28, 49, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);

        text-align: center;
      }

      .rl-logo {
        display: block;

        width: 440px;
        max-width: none;
        height: auto;

        margin: -92px auto -82px;

        position: relative;
        left: 50%;
        transform: translateX(-50%);

        background: transparent;
        border: none;
        box-shadow: none;
      }

      h1 {
        margin: 0 0 9px;

        color: #042c49;

        font-size: 27px;
        line-height: 1.2;
        font-weight: 750;
        letter-spacing: -0.5px;
      }

      .rl-subtitle {
        margin: 0 0 27px;

        color: #6b7280;

        font-size: 14px;
        line-height: 1.55;
      }

      .rl-field {
        margin-bottom: 18px;
        text-align: left;
      }

      .rl-field label {
        display: block;

        margin-bottom: 7px;

        color: #334155;

        font-size: 13px;
        font-weight: 650;
      }

      .rl-field input {
        width: 100%;
        height: 46px;

        padding: 0 48px 0 14px;

        border: 1px solid #d8dee7;
        border-radius: 10px;

        background: #ffffff;
        color: #0f172a;

        font-size: 15px;

        outline: none;

        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .rl-field input:focus {
        border-color: #00a143;
        box-shadow: 0 0 0 3px rgba(0, 161, 67, 0.1);
      }

      .rl-password-wrap {
        position: relative;
      }

      .rl-password-toggle {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);

        border: 0;
        background: transparent;

        padding: 5px;

        cursor: pointer;

        font-size: 18px;
        line-height: 1;

        opacity: 0.7;
      }

      .rl-password-toggle:hover {
        opacity: 1;
      }

      .rl-message {
        margin: 2px 0 16px;
        padding: 11px 12px;

        border-radius: 9px;

        font-size: 13px;
        line-height: 1.5;
        text-align: left;
      }

      .rl-error {
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: #b91c1c;
      }

      .rl-success {
        border: 1px solid #bbf7d0;
        background: #f0fdf4;
        color: #166534;
      }

      #rlResetPasswordButton {
        width: 100%;
        height: 47px;

        border: 0;
        border-radius: 10px;

        background: #00a143;
        color: #ffffff;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        transition:
          transform 0.12s ease,
          background 0.12s ease,
          box-shadow 0.12s ease;
      }

      #rlResetPasswordButton:hover {
        background: #008d3b;
        box-shadow: 0 7px 18px rgba(0, 161, 67, 0.2);
      }

      #rlResetPasswordButton:active {
        transform: translateY(1px);
      }

      #rlResetPasswordButton:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .rl-back {
        margin-top: 20px;
        font-size: 13px;
      }

      .rl-back a {
        color: #04783a;
        font-weight: 650;
        text-decoration: none;
      }

      .rl-back a:hover {
        text-decoration: underline;
      }

      @media (max-width: 520px) {
        body {
          padding: 20px 14px;
        }

        .rl-card {
          padding: 30px 24px 32px;
        }

        .rl-logo {
          width: 400px;
        }
      }
    </style>
  </head>

  <body>
    <main class="rl-card">
      <img src="rapportlink-login-logo.png" alt="RapportLink" class="rl-logo" />

      <h1>Reset your password</h1>

      <p class="rl-subtitle">
        Choose a new password for your RapportLink account.
      </p>

      <form id="rlResetPasswordForm">
        <div class="rl-field">
          <label for="rlNewPassword">New Password</label>

          <div class="rl-password-wrap">
            <input
              type="password"
              id="rlNewPassword"
              autocomplete="new-password"
              minlength="10"
              required
            />

            <button
              type="button"
              class="rl-password-toggle"
              data-target="rlNewPassword"
              aria-label="Show password"
              title="Show password"
            >
              👁
            </button>
          </div>
        </div>

        <div class="rl-field">
          <label for="rlConfirmPassword">Confirm New Password</label>

          <div class="rl-password-wrap">
            <input
              type="password"
              id="rlConfirmPassword"
              autocomplete="new-password"
              minlength="10"
              required
            />

            <button
              type="button"
              class="rl-password-toggle"
              data-target="rlConfirmPassword"
              aria-label="Show password"
              title="Show password"
            >
              👁
            </button>
          </div>
        </div>

        <div id="rlResetMessage" class="rl-message" style="display: none"></div>

        <button type="submit" id="rlResetPasswordButton">Reset Password</button>
      </form>

      <div class="rl-back">
        <a href="/">← Back to Sign In</a>
      </div>
    </main>

    <script>
      const resetForm = document.getElementById("rlResetPasswordForm");

      const newPassword = document.getElementById("rlNewPassword");

      const confirmPassword = document.getElementById("rlConfirmPassword");

      const resetButton = document.getElementById("rlResetPasswordButton");

      const messageBox = document.getElementById("rlResetMessage");

      function showMessage(message, type) {
        messageBox.textContent = message;

        messageBox.className =
          type === "success" ? "rl-message rl-success" : "rl-message rl-error";

        messageBox.style.display = "block";
      }

      document.querySelectorAll(".rl-password-toggle").forEach((button) => {
        button.addEventListener("click", function () {
          const target = document.getElementById(
            this.getAttribute("data-target"),
          );

          const isHidden = target.type === "password";

          target.type = isHidden ? "text" : "password";

          this.textContent = isHidden ? "🙈" : "👁";

          this.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password",
          );

          this.title = isHidden ? "Hide password" : "Show password";
        });
      });

      resetForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        messageBox.style.display = "none";
        messageBox.textContent = "";

        const password = newPassword.value;

        const confirmation = confirmPassword.value;

        if (password.length < 10) {
          showMessage(
            "Your new password must be at least 10 characters long.",
            "error",
          );

          return;
        }

        if (password !== confirmation) {
          showMessage("The passwords do not match.", "error");

          return;
        }

        const params = new URLSearchParams(window.location.search);

        const token = params.get("token");

        if (!token) {
          showMessage("This password reset link is invalid.", "error");

          return;
        }

        resetButton.disabled = true;
        resetButton.textContent = "Resetting...";

        try {
          const response = await fetch("/api/auth/reset-password", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },

            body: JSON.stringify({
              token,
              password,
            }),
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to reset your password.");
          }

          showMessage(
            data.message || "Your password has been reset successfully.",
            "success",
          );

          newPassword.value = "";
          confirmPassword.value = "";

          resetButton.style.display = "none";

          setTimeout(() => {
            window.location.href = "/";
          }, 1800);
        } catch (error) {
          console.error("RapportLink password-reset error:", error);

          showMessage(
            error.message || "Unable to reset your password.",
            "error",
          );

          resetButton.disabled = false;
          resetButton.textContent = "Reset Password";
        }
      });
    </script>
  </body>
</html>
